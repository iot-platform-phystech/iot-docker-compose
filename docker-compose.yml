
services:
  db:
    image: postgres:15-alpine
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iotpass
      POSTGRES_DB: iot_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: ../iot-core
    container_name: iot_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  adapter:
    build:
      context: ../iot-http-adapter
    container_name: iot_http_adapter
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      IOT_CORE_URL: http://core:8000
      IOT_ADAPTER_HOST: 0.0.0.0
    depends_on:
      - core

volumes:
  pgdata:
    external: true
    name: iot-docker-compose_pgdata
